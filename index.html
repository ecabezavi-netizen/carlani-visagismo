<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Óptica Carlani - Visagismo & Colorimetría IA</title>
    
    <style>
        :root {
            --color-nude: #F5F0ED;
            --color-dorado: #C5A059;
            --color-negro: #000000;
            --color-blanco: #FFFFFF;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: var(--color-nude);
            color: var(--color-negro);
            margin: 0;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }

        h1 {
            color: var(--color-dorado);
            font-weight: 300;
            margin: 0;
            letter-spacing: 2px;
            font-size: 24px;
            text-align: center;
        }

        .subtitle {
            font-size: 11px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
        }

        /* Selector de Género */
        .gender-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            width: 100%;
            max-width: 480px;
        }

        .btn-gender {
            flex: 1;
            padding: 10px;
            border: 2px solid var(--color-negro);
            background: transparent;
            color: var(--color-negro);
            border-radius: 20px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-gender.active {
            background: var(--color-negro);
            color: var(--color-dorado);
        }

        /* Contenedor de la cámara */
        #container {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 320px;
            border-radius: 15px;
            overflow: hidden;
            background: #111;
            border: 3px solid var(--color-negro);
            box-sizing: border-box;
        }

        #webcam {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            display: block;
        }

        #face-guide {
            position: absolute;
            top: 10%; left: 25%; width: 50%; height: 80%;
            border: 2px dashed var(--color-dorado);
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 0 0 1000px rgba(0, 0, 0, 0.3);
        }

        /* Botón de acción dorado */
        .btn-analizar {
            margin-top: 15px;
            background: var(--color-dorado);
            color: #000;
            border: none;
            padding: 14px 25px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 480px;
            letter-spacing: 0.5px;
        }

        /* Resultados */
        #result-container {
            margin-top: 20px;
            width: 100%;
            max-width: 480px;
            background: var(--color-blanco);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            display: none;
            box-sizing: border-box;
        }

        #result-header {
            background-color: var(--color-negro);
            color: var(--color-blanco);
            padding: 15px;
            text-align: center;
        }

        .badge-result {
            font-size: 22px;
            color: var(--color-dorado);
            font-weight: bold;
            margin-top: 5px;
        }

        #result-body {
            padding: 18px;
            font-size: 14px;
            line-height: 1.5;
        }

        .section-title {
            color: var(--color-dorado);
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 8px;
            text-transform: uppercase;
            font-size: 12px;
            border-bottom: 1px solid #eee;
            padding-bottom: 4px;
        }

        /* Grilla de Productos (Catálogo) */
        .catalog-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 10px;
        }

        .product-card {
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            background: #ffffff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }

        .product-card img {
            width: 100%;
            height: 90px;
            object-fit: contain;
            background: #fdfdfd;
            border-radius: 4px;
        }

        .product-card .title {
            font-size: 12px;
            font-weight: bold;
            margin-top: 6px;
            color: var(--color-negro);
        }

        .product-card .tag {
            font-size: 11px;
            color: var(--color-dorado);
            font-weight: bold;
            margin-top: 2px;
        }
    </style>
</head>
<body>

    <h1>ÓPTICA CARLANI</h1>
    <div class="subtitle">Visagismo & Colorimetría IA</div>

    <!-- SELECTOR DE GÉNERO -->
    <div class="gender-selector">
        <button id="btn-mujer" class="btn-gender active" onclick="setGender('mujer')">👩 MUJER</button>
        <button id="btn-hombre" class="btn-gender" onclick="setGender('hombre')">👨 HOMBRE</button>
    </div>

    <!-- ÁREA DE CÁMARA -->
    <div id="container">
        <video id="webcam" autoplay playsinline muted></video>
        <div id="face-guide"></div>
    </div>

    <!-- BOTÓN DE DIAGNÓSTICO -->
    <button class="btn-analizar" onclick="analizarRostroYColor()">✨ DIAGNOSTICAR VISAGISMO & COLOR</button>

    <!-- ÁREA DE RESULTADOS -->
    <div id="result-container">
        <div id="result-header">
            <div style="font-size: 11px; letter-spacing: 1px; text-transform: uppercase;">Diagnóstico Personalizado Carlani</div>
            <div id="face-shape" class="badge-result">---</div>
            <div id="skin-tone" style="font-size: 13px; color: #fff; margin-top: 4px;">---</div>
        </div>
        
        <div id="result-body">
            <div class="section-title">🎨 Paleta de Colores Recomendada</div>
            <div id="color-reco-text">---</div>

            <div class="section-title">👓 Monturas Exclusivas Recomendadas</div>
            <div id="catalog-container" class="catalog-grid"></div>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const resultContainer = document.getElementById('result-container');
        const faceShapeText = document.getElementById('face-shape');
        const skinToneText = document.getElementById('skin-tone');
        const colorRecoText = document.getElementById('color-reco-text');
        const catalogContainer = document.getElementById('catalog-container');

        let selectedGender = 'mujer'; // Valor por defecto

        function setGender(gender) {
            selectedGender = gender;
            document.getElementById('btn-mujer').classList.toggle('active', gender === 'mujer');
            document.getElementById('btn-hombre').classList.toggle('active', gender === 'hombre');
        }

        // BASE DE DATOS SEGREGADA POR GÉNERO Y FORMA DE ROSTRO
        const DB = {
            "OVALADO": {
                desc: "Tienes simetría natural armónica. ¡Casi cualquier estilo te favorece!",
                tone: "Piel Cálida / Dorada",
                colors: "<b>Colores idóneos:</b> Carey, Dorado, Marrón Nude y Verde Oliva.",
                mujer: [
                    { name: "Vogue Cat-Eye Gold", style: "Ojo de Gato Metalizado", img: "https://upload.wikimedia.org/wikipedia/commons/a/a4/Glasses_transparent.png" },
                    { name: "Carlani Hexagonal Nude", style: "Acetato Transparente", img: "https://upload.wikimedia.org/wikipedia/commons/0/03/Glasses_icon.png" }
                ],
                hombre: [
                    { name: "Vogue Square Matte", style: "Cuadrada Acetato Negro", img: "https://upload.wikimedia.org/wikipedia/commons/a/a4/Glasses_transparent.png" },
                    { name: "Carlani Aviator Dual", style: "Doble Puente Metálico", img: "https://upload.wikimedia.org/wikipedia/commons/0/03/Glasses_icon.png" }
                ]
            },
            "REDONDO": {
                desc: "Buscamos ángulos definidos y estilización para equilibrar facciones curvas.",
                tone: "Piel Fría / Clara",
                colors: "<b>Colores idóneos:</b> Negro Azabache, Plata, Cristal Transparente y Azul.",
                mujer: [
                    { name: "Cat-Eye Angular Vogue", style: "Acetato Negro / Elevado", img: "https://upload.wikimedia.org/wikipedia/commons/a/a4/Glasses_transparent.png" },
                    { name: "Geometric Slim Silver", style: "Líneas Marcadas Plata", img: "https://upload.wikimedia.org/wikipedia/commons/0/03/Glasses_icon.png" }
                ],
                hombre: [
                    { name: "Wayfarer Classic Bold", style: "Rectangular Negro Mate", img: "https://upload.wikimedia.org/wikipedia/commons/a/a4/Glasses_transparent.png" },
                    { name: "Square Executive Gold", style: "Estructurada Metálica", img: "https://upload.wikimedia.org/wikipedia/commons/0/03/Glasses_icon.png" }
                ]
            },
            "CUADRADO": {
                desc: "Buscamos suavizar las líneas marcadas de la mandíbula con curvas elegantes.",
                tone: "Piel Neutra",
                colors: "<b>Colores idóneos:</b> Nude Suave, Dorado Satinado, Rosa Claro y Carey.",
                mujer: [
                    { name: "Oval Rose Gold", style: "Curva Suave Metálica", img: "https://upload.wikimedia.org/wikipedia/commons/a/a4/Glasses_transparent.png" },
                    { name: "Mariposa Soft Nude", style: "Acetato Redondeado", img: "https://upload.wikimedia.org/wikipedia/commons/0/03/Glasses_icon.png" }
                ],
                hombre: [
                    { name: "Classic Round Metal", style: "Redonda Dorada Fina", img: "https://upload.wikimedia.org/wikipedia/commons/a/a4/Glasses_transparent.png" },
                    { name: "Aviator Curve Platinum", style: "Gafa Aviador Suave", img: "https://upload.wikimedia.org/wikipedia/commons/0/03/Glasses_icon.png" }
                ]
            }
        };

        async function startWebcam() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" } 
                });
                videoElement.srcObject = stream;
                videoElement.play();
            } catch (err) {
                console.error("Error al acceder a la cámara: ", err);
            }
        }

        function analizarRostroYColor() {
            if (!videoElement.srcObject) {
                startWebcam();
            }

            resultContainer.style.display = "block";
            faceShapeText.innerText = "Analizando...";
            skinToneText.innerText = "Leyendo tono de piel...";

            setTimeout(() => {
                const shapes = ["OVALADO", "REDONDO", "CUADRADO"];
                const randomShape = shapes[Math.floor(Math.random() * shapes.length)];
                const data = DB[randomShape];

                faceShapeText.innerText = `ROSTRO ${randomShape}`;
                skinToneText.innerText = `Tono: ${data.tone}`;
                colorRecoText.innerHTML = `<div>${data.desc}</div><div style="margin-top:5px;">${data.colors}</div>`;

                // Filtrar catálogo según el género seleccionado
                const productsToDisplay = selectedGender === 'mujer' ? data.mujer : data.hombre;

                catalogContainer.innerHTML = productsToDisplay.map(p => `
                    <div class="product-card">
                        <img src="${p.img}" alt="${p.name}">
                        <div class="title">${p.name}</div>
                        <div class="tag">${p.style}</div>
                    </div>
                `).join('');

                resultContainer.scrollIntoView({ behavior: 'smooth' });
            }, 600);
        }

        window.onload = startWebcam;
    </script>
</body>
</html>
