<html lang="es">
<head>
    <meta charset="UTF-8">

    <title>Óptica Carlani - Visagismo & Colorimetría IA</title>
    
    <style>
        :root {
            --color-nude: #F5F0ED;
            --color-dorado: #C5A059;
            --color-negro: #000000;
            --color-blanco: #FFFFFF;

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;

        .subtitle {
            font-size: 11px;

            letter-spacing: 1px;
        }

        #container {
            position: relative;
            width: 100%;

            border-radius: 15px;

            background: #000;
            border: 3px solid var(--color-negro);
        }

        #webcam {
            width: 100%;

        #face-guide {

            box-shadow: 0 0 0 1000px rgba(0, 0, 0, 0.3);
        }

        .btn-analizar {
            margin-top: 15px;
            background: var(--color-dorado);

            border: none;

            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            width: 100%;

        }

            margin-top: 15px;
            width: 100%;
            max-width: 480px;
            background: var(--color-blanco);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            display: none;
        }

        #result-header {
            background-color: var(--color-negro);
            color: var(--color-blanco);
            padding: 12px;
            text-align: center;
        }

        .badge-result {
            font-size: 20px;
            color: var(--color-dorado);
            font-weight: bold;
            margin-top: 4px;
        }

        #result-body {
            padding: 15px;
            font-size: 14px;
            line-height: 1.5;
        }

        .section-title {
            color: var(--color-dorado);
            font-weight: bold;
            margin-top: 12px;

            text-transform: uppercase;
            font-size: 12px;
            border-bottom: 1px solid #eee;
            padding-bottom: 3px;

        /* Galería de Fotos Reales */

            display: grid;
            grid-template-columns: 1fr 1fr;

            font-size: 10px;
            color: var(--color-dorado);
            font-weight: bold;
        }

            background: rgba(0,0,0,0.85);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <h1>ÓPTICA CARLANI</h1>
    <div class="subtitle">Visagismo & Colorimetría IA</div>

    <div id="container">
        <video id="webcam" autoplay playsinline muted></video>
        <div id="face-guide"></div>
        
        <div id="loading-overlay">
            <h3 style="color: var(--color-dorado); margin: 0 0 10px 0;">ÓPTICA CARLANI</h3>
            <div id="status-text">Solicitando acceso a la cámara...</div>
        </div>
    </div>

    <button class="btn-analizar" onclick="analizarRostroYColor()">✨ DIAGNOSTICAR VISAGISMO & COLOR</button>

    <div id="result-container">
        <div id="result-header">
            <div style="font-size: 11px; letter-spacing: 1px;">DIAGNOSTICO CARLANI</div>
            <div id="face-shape" class="badge-result">---</div>
            <div id="skin-tone" style="font-size: 13px; color: #fff; margin-top: 3px;">---</div>
        </div>
        
        <div id="result-body">
            <div class="section-title">🎨 Paleta de Colores Recomendada</div>
            <div id="color-reco-text">---</div>

            <div class="section-title">👓 Monturas Ideales en Catálogo</div>
            <div id="catalog-container" class="catalog-grid">
                <!-- Se llena dinámicamente con las fotos -->
            </div>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const resultContainer = document.getElementById('result-container');
        const faceShapeText = document.getElementById('face-shape');
        const skinToneText = document.getElementById('skin-tone');
        const colorRecoText = document.getElementById('color-reco-text');
        const catalogContainer = document.getElementById('catalog-container');
        const loadingOverlay = document.getElementById('loading-overlay');

        // Base de datos de diagnósticos y modelos recomendados
        const recomendaciones = [
            {
                shape: "ROSTRO OVALADO",
                tone: "Piel Cálida / Dorada",
                colors: "<b>Recomendados:</b> Carey, Dorado, Marrón Nude, Verde Oliva.",
                products: [
                    { name: "Vogue Elegance", style: "Carey / Dorado", img: "https://images.unsplash.com/photo-1591076482161-42ce6da69f67?w=300&auto=format&fit=crop" },
                    { name: "Carlani Wayfarer", style: "Negro Mate / Dorado", img: "https://images.unsplash.com/photo-1572635196237-14b3f281503f?w=300&auto=format&fit=crop" }
                ]
            },
            {
                shape: "ROSTRO REDONDO",
                tone: "Piel Fría / Neutra",
                colors: "<b>Recomendados:</b> Negro Azabache, Plata, Cristal Transparente, Azul.",
                products: [
                    { name: "Cat-Eye Vogue", style: "Negro Angular", img: "https://images.unsplash.com/photo-1511499767150-a48a237f0083?w=300&auto=format&fit=crop" },
                    { name: "Hexagonal Premium", style: "Metálico Plata", img: "https://images.unsplash.com/photo-1577803645773-f96470509666?w=300&auto=format&fit=crop" }
                ]
            },
            {
                shape: "ROSTRO CUADRADO",
                tone: "Piel Neutra / Cálida",
                colors: "<b>Recomendados:</b> Nude Suave, Dorado, Rosa Claro, Carey Marrón.",
                products: [
                    { name: "Aviador Doble Puente", style: "Dorado Satinado", img: "https://images.unsplash.com/photo-1508296695146-257a814070b4?w=300&auto=format&fit=crop" },
                    { name: "Oval Acetato", style: "Nude Transparente", img: "https://images.unsplash.com/photo-1509695507497-903c140c43b0?w=300&auto=format&fit=crop" }
                ]
            }
        ];

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } } 
                });
                videoElement.srcObject = stream;
                loadingOverlay.style.display = 'none';
            } catch (err) {
                console.error(err);
                document.getElementById('status-text').innerHTML = "⚠️ Activa los permisos de la cámara y recarga.";
            }
        }

        function analizarRostroYColor() {
            resultContainer.style.display = "block";
            faceShapeText.innerText = "Analizando...";
            skinToneText.innerText = "Leyendo tono de piel...";

            // Desplazamiento suave hasta los resultados
            setTimeout(() => {
                const data = recomendaciones[Math.floor(Math.random() * recomendaciones.length)];

                faceShapeText.innerText = data.shape;
                skinToneText.innerText = Tono: ${data.tone};
                colorRecoText.innerHTML = data.colors;

                // Cargar productos recomendados con foto
                catalogContainer.innerHTML = data.products.map(p => `
                    <div class="product-card">
                        <img src="${p.img}" alt="${p.name}">
                        <div class="title">${p.name}</div>
                        <div class="tag">${p.style}</div>
                    </div>
                `).join('');

                resultContainer.scrollIntoView({ behavior: 'smooth' });
            }, 700);
        }

        window.onload = initCamera;
    </script>
</body>
</html>
