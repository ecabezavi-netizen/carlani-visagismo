<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Óptica Carlani - Visagismo Profesional</title>
    
    <!-- Librerías de IA Facial de Google MediaPipe -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

    <style>
        :root {
            --color-nude: #F5F0ED;
            --color-dorado: #C5A059;
            --color-negro: #000000;
            --color-blanco: #FFFFFF;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: var(--color-nude);
            color: var(--color-negro);
            margin: 0;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }

        h1 {
            color: var(--color-dorado);
            font-weight: 300;
            margin: 0;
            letter-spacing: 2px;
            font-size: 24px;
            text-align: center;
        }

        .subtitle {
            font-size: 11px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
        }

        /* Selector de Género */
        .gender-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            width: 100%;
            max-width: 480px;
        }

        .btn-gender {
            flex: 1;
            padding: 10px;
            border: 2px solid var(--color-negro);
            background: transparent;
            color: var(--color-negro);
            border-radius: 20px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-gender.active {
            background: var(--color-negro);
            color: var(--color-dorado);
        }

        /* Área de Cámara */
        #container {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 340px;
            border-radius: 15px;
            overflow: hidden;
            background: #111;
            border: 3px solid var(--color-negro);
            box-sizing: border-box;
        }

        #webcam, #canvas-mesh {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        /* Botón de Diagnóstico */
        .btn-analizar {
            margin-top: 15px;
            background: var(--color-dorado);
            color: #000;
            border: none;
            padding: 14px 25px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 480px;
            letter-spacing: 0.5px;
        }

        /* Resultados */
        #result-container {
            margin-top: 20px;
            width: 100%;
            max-width: 480px;
            background: var(--color-blanco);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            display: none;
            box-sizing: border-box;
        }

        #result-header {
            background-color: var(--color-negro);
            color: var(--color-blanco);
            padding: 15px;
            text-align: center;
        }

        .badge-result {
            font-size: 22px;
            color: var(--color-dorado);
            font-weight: bold;
            margin-top: 5px;
        }

        #result-body {
            padding: 18px;
            font-size: 14px;
            line-height: 1.5;
        }

        .section-title {
            color: var(--color-dorado);
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 8px;
            text-transform: uppercase;
            font-size: 12px;
            border-bottom: 1px solid #eee;
            padding-bottom: 4px;
        }

        .catalog-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 10px;
        }

        .product-card {
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            background: #ffffff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .product-card svg {
            width: 100%;
            height: 65px;
            margin-bottom: 5px;
        }

        .product-card .title {
            font-size: 12px;
            font-weight: bold;
            margin-top: 4px;
            color: var(--color-negro);
        }

        .product-card .tag {
            font-size: 11px;
            color: var(--color-dorado);
            font-weight: bold;
            margin-top: 2px;
        }
    </style>
</head>
<body>

    <h1>ÓPTICA CARLANI</h1>
    <div class="subtitle">Guía de Visagismo & Elección de Armazón</div>

    <!-- SELECTOR DE GÉNERO -->
    <div class="gender-selector">
        <button id="btn-hombre" class="btn-gender active" onclick="setGender('hombre')">👨 HOMBRE</button>
        <button id="btn-mujer" class="btn-gender" onclick="setGender('mujer')">👩 MUJER</button>
    </div>

    <!-- ÁREA DE CÁMARA E IA -->
    <div id="container">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="canvas-mesh"></canvas>
    </div>

    <!-- BOTÓN DE DIAGNÓSTICO -->
    <button class="btn-analizar" onclick="ejecutarAnalisisIA()">✨ DIAGNOSTICAR ARMAZÓN IDEAL</button>

    <!-- ÁREA DE RESULTADOS -->
    <div id="result-container">
        <div id="result-header">
            <div style="font-size: 11px; letter-spacing: 1px; text-transform: uppercase;">Diagnóstico Personalizado Carlani</div>
            <div id="face-shape" class="badge-result">Escaneando...</div>
            <div id="skin-tone" style="font-size: 13px; color: #fff; margin-top: 4px;">---</div>
        </div>
        
        <div id="result-body">
            <div class="section-title">🎨 Paleta de Colores Recomendada</div>
            <div id="color-reco-text">---</div>

            <div class="section-title">👓 Diseños de Armazón Ideales</div>
            <div id="catalog-container" class="catalog-grid"></div>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('canvas-mesh');
        const canvasCtx = canvasElement.getContext('2d');
        const resultContainer = document.getElementById('result-container');
        const faceShapeText = document.getElementById('face-shape');
        const skinToneText = document.getElementById('skin-tone');
        const colorRecoText = document.getElementById('color-reco-text');
        const catalogContainer = document.getElementById('catalog-container');

        let selectedGender = 'hombre';
        let currentLandmarks = null;

        function setGender(gender) {
            selectedGender = gender;
            document.getElementById('btn-hombre').classList.toggle('active', gender === 'hombre');
            document.getElementById('btn-mujer').classList.toggle('active', gender === 'mujer');
        }

        // VECTORES SVG VECTORIALES EXACTOS A TU GUÍA VISUAL
        const SVG_DESIGNS = {
            agatadas: `<svg viewBox="0 0 200 80" xmlns="http://www.w3.org/2000/svg"><path d="M15 15 Q55 25 75 45 Q45 65 20 50 Z" stroke="#111" stroke-width="5" fill="none"/><path d="M185 15 Q145 25 125 45 Q155 65 180 50 Z" stroke="#111" stroke-width="5" fill="none"/><line x1="75" y1="35" x2="125" y2="35" stroke="#111" stroke-width="4"/></svg>`,
            redondas: `<svg viewBox="0 0 200 80" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="40" r="25" stroke="#C5A059" stroke-width="4" fill="none"/><circle cx="150" cy="40" r="25" stroke="#C5A059" stroke-width="4" fill="none"/><line x1="75" y1="40" x2="125" y2="40" stroke="#C5A059" stroke-width="3"/></svg>`,
            cuadradas: `<svg viewBox="0 0 200 80" xmlns="http://www.w3.org/2000/svg"><path d="M20 20 H80 V60 H20 Z M120 20 H180 V60 H120 Z M80 35 H120" stroke="#111" stroke-width="6" fill="none" rx="5"/><line x1="0" y1="30" x2="20" y2="30" stroke="#111" stroke-width="5"/><line x1="180" y1="30" x2="200" y2="30" stroke="#111" stroke-width="5"/></svg>`,
            aviador: `<svg viewBox="0 0 200 80" xmlns="http://www.w3.org/2000/svg"><path d="M25 20 C50 15, 75 20, 75 40 C75 62, 45 65, 25 55 C15 45, 15 25, 25 20 Z" stroke="#C5A059" stroke-width="4" fill="none"/><path d="M175 20 C150 15, 125 20, 125 40 C125 62, 155 65, 175 55 C185 45, 185 25, 175 20 Z" stroke="#C5A059" stroke-width="4" fill="none"/><line x1="75" y1="25" x2="125" y2="25" stroke="#C5A059" stroke-width="3"/><line x1="75" y1="32" x2="125" y2="32" stroke="#C5A059" stroke-width="3"/></svg>`,
            rectangulares: `<svg viewBox="0 0 200 80" xmlns="http://www.w3.org/2000/svg"><rect x="15" y="25" width="70" height="30" rx="4" stroke="#111" stroke-width="5" fill="none"/><rect x="115" y="25" width="70" height="30" rx="4" stroke="#111" stroke-width="5" fill="none"/><line x1="85" y1="38" x2="115" y2="38" stroke="#111" stroke-width="4"/></svg>`,
            mariposa: `<svg viewBox="0 0 200 80" xmlns="http://www.w3.org/2000/svg"><path d="M15 15 Q80 20 75 45 Q40 70 20 50 Z" stroke="#111" stroke-width="5" fill="none"/><path d="M185 15 Q120 20 125 45 Q160 70 180 50 Z" stroke="#111" stroke-width="5" fill="none"/><line x1="75" y1="35" x2="125" y2="35" stroke="#111" stroke-width="4"/></svg>`,
            ovaladas: `<svg viewBox="0 0 200 80" xmlns="http://www.w3.org/2000/svg"><ellipse cx="50" cy="40" rx="30" ry="20" stroke="#C5A059" stroke-width="4" fill="none"/><ellipse cx="150" cy="40" rx="30" ry="20" stroke="#C5A059" stroke-width="4" fill="none"/><line x1="80" y1="40" x2="120" y2="40" stroke="#C5A059" stroke-width="3"/></svg>`
        };

        // ESTRUCTURA TAL CUAL TU GUÍA FOTOGRÁFICA
        const GUIA_VISAGISMO = {
            "OVALADA": {
                desc: "Equilibrio armónico natural. Admite gran variedad de formas de armazón.",
                hombre: {
                    tone: "Piel Neutra / Cálida",
                    colors: "<b>Colores masculinos idóneos:</b> Negro Mate, Carey Oscuro, Gunmetal y Azul Noche.",
                    products: [
                        { name: "Armazón Cuadrado Bold", style: "Estilo Cuadradas", svg: SVG_DESIGNS.cuadradas },
                        { name: "Armazón Aviador Premium", style: "Estilo Aviador Metálico", svg: SVG_DESIGNS.aviador },
                        { name: "Armazón Redondo Slim", style: "Estilo Redondas", svg: SVG_DESIGNS.redondas }
                    ]
                },
                mujer: {
                    tone: "Piel Cálida / Dorada",
                    colors: "<b>Colores femeninos idóneos:</b> Carey Dorado, Marrón Nude, Beige y Verde Oliva.",
                    products: [
                        { name: "Armazón Agatado Vogue", style: "Estilo Agatadas / Cat-Eye", svg: SVG_DESIGNS.agatadas },
                        { name: "Armazón Redondo Pastel", style: "Estilo Redondas", svg: SVG_DESIGNS.redondas },
                        { name: "Armazón Cuadrado Chic", style: "Estilo Cuadradas", svg: SVG_DESIGNS.cuadradas },
                        { name: "Armazón Aviador Classic", style: "Estilo Aviador", svg: SVG_DESIGNS.aviador }
                    ]
                }
            },
            "REDONDA": {
                desc: "Buscamos ángulos, cortes agudos y geometrías para alargar y estilizar el rostro.",
                hombre: {
                    tone: "Piel Fría / Clara",
                    colors: "<b>Colores masculinos idóneos:</b> Negro Azabache, Plata Pulido, Titanio y Azul Marino.",
                    products: [
                        { name: "Armazón Cuadrado Marcado", style: "Estilo Cuadradas", svg: SVG_DESIGNS.cuadradas },
                        { name: "Armazón Rectangular Slim", style: "Estilo Rectangulares", svg: SVG_DESIGNS.rectangulares }
                    ]
                },
                mujer: {
                    tone: "Piel Fría / Clara",
                    colors: "<b>Colores femeninos idóneos:</b> Negro Intenso, Plata, Cristal Transparente y Borgoña.",
                    products: [
                        { name: "Armazón Agatado Estilizado", style: "Estilo Agatadas", svg: SVG_DESIGNS.agatadas },
                        { name: "Armazón Cuadrado Bicolor", style: "Estilo Cuadradas", svg: SVG_DESIGNS.cuadradas },
                        { name: "Armazón Rectangular Chic", style: "Estilo Rectangulares", svg: SVG_DESIGNS.rectangulares },
                        { name: "Armazón Mariposa Glam", style: "Estilo Mariposa", svg: SVG_DESIGNS.mariposa }
                    ]
                }
            },
            "CORAZÓN": {
                desc: "Frente o pómulos anchos con mentón afinado. Buscamos balance en la parte inferior.",
                hombre: {
                    tone: "Piel Clara / Neutra",
                    colors: "<b>Colores masculinos idóneos:</b> Plata Satinado, Titanio Transparente, Azul Claro y Gris Metal.",
                    products: [
                        { name: "Armazón Aviador Dual", style: "Estilo Aviador", svg: SVG_DESIGNS.aviador },
                        { name: "Armazón Rectangular Light", style: "Estilo Rectangulares", svg: SVG_DESIGNS.rectangulares }
                    ]
                },
                mujer: {
                    tone: "Piel Cálida / Dorada",
                    colors: "<b>Colores femeninos idóneos:</b> Cristal Transparente, Rosa Palo, Dorado Fino y Celeste.",
                    products: [
                        { name: "Armazón Aviador Femenino", style: "Estilo Aviador", svg: SVG_DESIGNS.aviador },
                        { name: "Armazón Rectangular Tortoise", style: "Estilo Rectangulares", svg: SVG_DESIGNS.rectangulares },
                        { name: "Armazón Mariposa Elegance", style: "Estilo Mariposa", svg: SVG_DESIGNS.mariposa }
                    ]
                }
            },
            "DIAMANTE": {
                desc: "Pómulos prominentes con frente y mentón estrechos. Buscamos suavizar la zona media.",
                hombre: {
                    tone: "Piel Neutra",
                    colors: "<b>Colores masculinos idóneos:</b> Gunmetal, Negro Mate, Bronce y Carey Oscuro.",
                    products: [
                        { name: "Armazón Ovalado Executive", style: "Estilo Ovaladas", svg: SVG_DESIGNS.ovaladas },
                        { name: "Armazón Redondo Classic", style: "Estilo Redondas", svg: SVG_DESIGNS.redondas }
                    ]
                },
                mujer: {
                    tone: "Piel Cálida / Nude",
                    colors: "<b>Colores femeninos idóneos:</b> Dorado, Ámbar, Nude Suave y Negro Brillante.",
                    products: [
                        { name: "Armazón Ovalado Amber", style: "Estilo Ovaladas", svg: SVG_DESIGNS.ovaladas },
                        { name: "Armazón Redondo Deep", style: "Estilo Redondas", svg: SVG_DESIGNS.redondas },
                        { name: "Armazón Agatado Sharp", style: "Estilo Agatadas", svg: SVG_DESIGNS.agatadas }
                    ]
                }
            },
            "CUADRADA": {
                desc: "Mandíbula y frente marcadas. Buscamos suavizar facciones mediante curvas y estilos agudos.",
                hombre: {
                    tone: "Piel Cálida / Morena",
                    colors: "<b>Colores masculinos idóneos:</b> Carey Marrón Oscuro, Dorado Antiguo y Bronce.",
                    products: [
                        { name: "Armazón Redondo Gold", style: "Estilo Redondas", svg: SVG_DESIGNS.redondas },
                        { name: "Armazón Ovalado Curve", style: "Estilo Ovaladas", svg: SVG_DESIGNS.ovaladas }
                    ]
                },
                mujer: {
                    tone: "Piel Neutra",
                    colors: "<b>Colores femeninos idóneos:</b> Nude Suave, Rosa Palo, Dorado Satinado y Carey Claro.",
                    products: [
                        { name: "Armazón Redondo Thin", style: "Estilo Redondas", svg: SVG_DESIGNS.redondas },
                        { name: "Armazón Ovalado Soft", style: "Estilo Ovaladas", svg: SVG_DESIGNS.ovaladas },
                        { name: "Armazón Cat-Eye Bold", style: "Estilo Cat-Eye / Agatadas", svg: SVG_DESIGNS.agatadas }
                    ]
                }
            }
        };

        // CONFIGURACIÓN DE IA MEDIAPIPE FACE MESH
        const faceMesh = new FaceMesh({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
        });

        faceMesh.setOptions({
            maxNumFaces: 1,
            refineLandmarks: true,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
        });

        faceMesh.onResults(onResults);

        function onResults(results) {
            canvasElement.width = videoElement.videoWidth;
            canvasElement.height = videoElement.videoHeight;
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                currentLandmarks = results.multiFaceLandmarks[0];

                canvasCtx.fillStyle = '#C5A059';
                const keyIndices = [10, 152, 234, 454, 136, 365, 103, 332];
                for (const idx of keyIndices) {
                    const pt = currentLandmarks[idx];
                    const x = pt.x * canvasElement.width;
                    const y = pt.y * canvasElement.height;
                    canvasCtx.beginPath();
                    canvasCtx.arc(x, y, 3, 0, 2 * Math.PI);
                    canvasCtx.fill();
                }
            } else {
                currentLandmarks = null;
            }
            canvasCtx.restore();
        }

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await faceMesh.send({image: videoElement});
            },
            width: 640,
            height: 480
        });

        camera.start();

        // ALGORITMO DE DETECCIÓN EXACTO BASADO EN TU GUÍA FOTOGRÁFICA
        function calcularFormaGuiadaIA() {
            if (!currentLandmarks) return "OVALADA";

            const top = currentLandmarks[10];        
            const bottom = currentLandmarks[152];    
            const leftCheek = currentLandmarks[234];  
            const rightCheek = currentLandmarks[454]; 
            const leftJaw = currentLandmarks[136];    
            const rightJaw = currentLandmarks[365];   
            const leftForehead = currentLandmarks[103]; 
            const rightForehead = currentLandmarks[332];

            const largoRostro = Math.hypot(top.x - bottom.x, top.y - bottom.y);
            const anchoPomulos = Math.hypot(leftCheek.x - rightCheek.x, leftCheek.y - rightCheek.y);
            const anchoMandibula = Math.hypot(leftJaw.x - rightJaw.x, leftJaw.y - rightJaw.y);
            const anchoFrente = Math.hypot(leftForehead.x - rightForehead.x, leftForehead.y - rightForehead.y);

            const ratioLargoAncho = largoRostro / anchoPomulos;
            const ratioMandibulaPomulos = anchoMandibula / anchoPomulos;
            const ratioMentonFrente = anchoMandibula / anchoFrente;

            // REGISTRO DE CLASIFICACIÓN RIGUROSO:
            // 1. CARA EN FORMA DE DIAMANTE: Pómulos marcadamente más anchos que la frente y el mentón
            if (anchoPomulos > anchoFrente * 1.15 && ratioMandibulaPomulos < 0.75) {
                return "DIAMANTE";
            }

            // 2. CARA EN FORMA DE CORAZÓN: Frente amplia y mentón marcadamente afilado
            if (ratioMentonFrente < 0.73 && ratioMandibulaPomulos < 0.77) {
                return "CORAZÓN";
            }

            // 3. CARAS CUADRADAS: Mandíbula ancha y angular igual a pómulos
            if (ratioMandibulaPomulos > 0.86) {
                return "CUADRADA";
            }

            // 4. CARAS REDONDAS: Proporciones cortas y curvas (Ratio largo/ancho compacto < 1.22)
            if (ratioLargoAncho < 1.22) {
                return "REDONDA";
            }

            // 5. CARAS OVALADAS: Rostro proporcionalmente alargado (> 1.22) y mentón suave
            return "OVALADA";
        }

        function ejecutarAnalisisIA() {
            if (!currentLandmarks) {
                alert("Por favor, encuadra tu rostro de frente a la cámara con buena iluminación.");
                return;
            }

            resultContainer.style.display = "block";
            faceShapeText.innerText = "Calculando proporciones...";

            setTimeout(() => {
                const shapeResult = calcularFormaGuiadaIA();
                const baseData = GUIA_VISAGISMO[shapeResult];
                const genderData = selectedGender === 'hombre' ? baseData.hombre : baseData.mujer;

                faceShapeText.innerText = `CARA ${shapeResult}`;
                skinToneText.innerText = `Tono: ${genderData.tone}`;
                colorRecoText.innerHTML = `<div>${baseData.desc}</div><div style="margin-top:5px;">${genderData.colors}</div>`;

                catalogContainer.innerHTML = genderData.products.map(p => `
                    <div class="product-card">
                        ${p.svg}
                        <div class="title">${p.name}</div>
                        <div class="tag">${p.style}</div>
                    </div>
                `).join('');

                resultContainer.scrollIntoView({ behavior: 'smooth' });
            }, 400);
        }
    </script>
</body>
</html>
