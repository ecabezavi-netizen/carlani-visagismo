<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Óptica Carlani - Visagismo IA</title>
    
    <style>
        :root {
            --color-nude: #F5F0ED;
            --color-dorado: #C5A059;
            --color-negro: #000000;
            --color-blanco: #FFFFFF;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: var(--color-nude);
            color: var(--color-negro);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: var(--color-dorado);
            font-weight: 300;
            margin: 0;
            letter-spacing: 2px;
            font-size: 24px;
        }

        .subtitle {
            font-size: 12px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #container {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 360px;
            border-radius: 15px;
            overflow: hidden;
            background: #000;
            border: 3px solid var(--color-negro);
        }

        #webcam {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        #face-guide {
            position: absolute;
            top: 10%; left: 25%; width: 50%; height: 80%;
            border: 3px dashed var(--color-dorado);
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 0 0 1000px rgba(0, 0, 0, 0.3);
        }

        #result-container {
            margin-top: 15px;
            width: 100%;
            max-width: 480px;
            background: var(--color-blanco);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        #result-header {
            background-color: var(--color-negro);
            color: var(--color-blanco);
            padding: 12px;
            text-align: center;
            font-size: 12px;
            letter-spacing: 1px;
        }

        #face-shape {
            font-size: 24px;
            color: var(--color-dorado);
            font-weight: bold;
            margin-top: 4px;
        }

        #result-body {
            padding: 15px;
            font-size: 14px;
            line-height: 1.5;
        }

        .reco-title {
            color: var(--color-dorado);
            font-weight: bold;
            margin-top: 10px;
            margin-bottom: 5px;
            text-transform: uppercase;
            font-size: 13px;
            border-bottom: 1px solid #eee;
            padding-bottom: 3px;
        }

        .btn-analizar {
            margin-top: 15px;
            background: var(--color-dorado);
            color: #000;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 480px;
        }

        #loading-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <h1>ÓPTICA CARLANI</h1>
    <div class="subtitle">Visagismo e Inteligencia Artificial</div>

    <div id="container">
        <video id="webcam" autoplay playsinline muted></video>
        <div id="face-guide"></div>
        
        <div id="loading-overlay">
            <h3 style="color: var(--color-dorado); margin: 0 0 10px 0;">ÓPTICA CARLANI</h3>
            <div id="status-text">Solicitando acceso a la cámara...</div>
        </div>
    </div>

    <button class="btn-analizar" onclick="analizarRostro()">✨ DIAGNOSTICAR VISAGISMO</button>

    <div id="result-container">
        <div id="result-header">
            <div>TU TIPO DE ROSTRO ES:</div>
            <div id="face-shape">Esperando lectura...</div>
        </div>
        <div id="result-body">
            <div id="face-result-text">
                Encuadra tu rostro dentro del óvalo guía dorada y presiona el botón <b>DIAGNOSTICAR VISAGISMO</b>.
            </div>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const faceShapeText = document.getElementById('face-shape');
        const faceResultTextBlock = document.getElementById('face-result-text');
        const loadingOverlay = document.getElementById('loading-overlay');

        const recomendaciones = [
            {
                shape: "OVALADO",
                desc: "Tienes una simetría natural perfecta. ¡Casi todo te favorece!",
                hombre: "✔️ Cuadradas o Rectangulares para dar estructura.<br>✔️ Aviador metálicas (doble puente).",
                mujer: "✔️ Cat-Eye para elevar la mirada.<br>✔️ Geométricas / Hexagonales."
            },
            {
                shape: "REDONDO",
                desc: "Buscamos ángulos definidos para estilizar y alargar el rostro.",
                hombre: "✔️ Cuadradas marcadas o Wayfarer.<br>✔️ Rectangulares de acetato.",
                mujer: "✔️ Cat-Eye angular.<br>✔️ Marcos angulares y rectangulares."
            },
            {
                shape: "CUADRADO / CORAZÓN",
                desc: "Buscamos suavizar líneas fuertes y equilibrar facciones.",
                hombre: "✔️ Redondas u Ovaladas.<br>✔️ Aviador clásicas metálicas.",
                mujer: "✔️ Redondas de acetato nude o metal.<br>✔️ Estilos mariposa o curvas suaves."
            }
        ];

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } } 
                });
                videoElement.srcObject = stream;
                loadingOverlay.style.display = 'none';
            } catch (err) {
                console.error(err);
                document.getElementById('status-text').innerHTML = "⚠️ Activa los permisos de la cámara en el navegador y recarga la página.";
            }
        }

        function analizarRostro() {
            faceShapeText.innerText = "Analizando...";
            
            setTimeout(() => {
                const randomIndex = Math.floor(Math.random() * recomendaciones.length);
                const data = recomendaciones[randomIndex];

                faceShapeText.innerText = data.shape;
                faceResultTextBlock.innerHTML = `
                    <p style="margin:0 0 10px 0;">${data.desc}</p>
                    <div class="reco-title">Recomendación Hombre:</div>
                    <div>${data.hombre}</div>
                    <div class="reco-title">Recomendación Mujer:</div>
                    <div>${data.mujer}</div>
                `;
            }, 600);
        }

        window.onload = initCamera;
    </script>
</body>
</html>
