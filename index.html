<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Óptica Carlani - Visagismo & Colorimetría IA</title>
    
    <style>
        :root {
            --color-nude: #F5F0ED;
            --color-dorado: #C5A059;
            --color-negro: #000000;
            --color-blanco: #FFFFFF;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: var(--color-nude);
            color: var(--color-negro);
            margin: 0;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }

        h1 {
            color: var(--color-dorado);
            font-weight: 300;
            margin: 0;
            letter-spacing: 2px;
            font-size: 24px;
            text-align: center;
        }

        .subtitle {
            font-size: 11px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
        }

        /* Selector de Género */
        .gender-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            width: 100%;
            max-width: 480px;
        }

        .btn-gender {
            flex: 1;
            padding: 10px;
            border: 2px solid var(--color-negro);
            background: transparent;
            color: var(--color-negro);
            border-radius: 20px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-gender.active {
            background: var(--color-negro);
            color: var(--color-dorado);
        }

        /* Área de Cámara */
        #container {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 320px;
            border-radius: 15px;
            overflow: hidden;
            background: #111;
            border: 3px solid var(--color-negro);
            box-sizing: border-box;
        }

        #webcam {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            display: block;
        }

        #face-guide {
            position: absolute;
            top: 10%; left: 25%; width: 50%; height: 80%;
            border: 2px dashed var(--color-dorado);
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 0 0 1000px rgba(0, 0, 0, 0.3);
        }

        /* Botón de Diagnóstico */
        .btn-analizar {
            margin-top: 15px;
            background: var(--color-dorado);
            color: #000;
            border: none;
            padding: 14px 25px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 480px;
            letter-spacing: 0.5px;
        }

        /* Resultados */
        #result-container {
            margin-top: 20px;
            width: 100%;
            max-width: 480px;
            background: var(--color-blanco);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            display: none;
            box-sizing: border-box;
        }

        #result-header {
            background-color: var(--color-negro);
            color: var(--color-blanco);
            padding: 15px;
            text-align: center;
        }

        .badge-result {
            font-size: 22px;
            color: var(--color-dorado);
            font-weight: bold;
            margin-top: 5px;
        }

        #result-body {
            padding: 18px;
            font-size: 14px;
            line-height: 1.5;
        }

        .section-title {
            color: var(--color-dorado);
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 8px;
            text-transform: uppercase;
            font-size: 12px;
            border-bottom: 1px solid #eee;
            padding-bottom: 4px;
        }

        /* Grilla de Galería */
        .catalog-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 10px;
        }

        .product-card {
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            background: #ffffff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .product-card svg {
            width: 100%;
            height: 70px;
            margin-bottom: 5px;
        }

        .product-card .title {
            font-size: 12px;
            font-weight: bold;
            margin-top: 4px;
            color: var(--color-negro);
        }

        .product-card .tag {
            font-size: 11px;
            color: var(--color-dorado);
            font-weight: bold;
            margin-top: 2px;
        }
    </style>
</head>
<body>

    <h1>ÓPTICA CARLANI</h1>
    <div class="subtitle">Visagismo & Colorimetría IA</div>

    <!-- SELECTOR DE GÉNERO -->
    <div class="gender-selector">
        <button id="btn-hombre" class="btn-gender active" onclick="setGender('hombre')">👨 HOMBRE</button>
        <button id="btn-mujer" class="btn-gender" onclick="setGender('mujer')">👩 MUJER</button>
    </div>

    <!-- ÁREA DE CÁMARA -->
    <div id="container">
        <video id="webcam" autoplay playsinline muted></video>
        <div id="face-guide"></div>
    </div>

    <!-- BOTÓN DE DIAGNÓSTICO -->
    <button class="btn-analizar" onclick="analizarRostroYColor()">✨ DIAGNOSTICAR VISAGISMO & COLOR</button>

    <!-- ÁREA DE RESULTADOS -->
    <div id="result-container">
        <div id="result-header">
            <div style="font-size: 11px; letter-spacing: 1px; text-transform: uppercase;">Diagnóstico Personalizado Carlani</div>
            <div id="face-shape" class="badge-result">---</div>
            <div id="skin-tone" style="font-size: 13px; color: #fff; margin-top: 4px;">---</div>
        </div>
        
        <div id="result-body">
            <div class="section-title">🎨 Paleta de Colores Recomendada</div>
            <div id="color-reco-text">---</div>

            <div class="section-title">👓 Monturas Exclusivas Recomendadas</div>
            <div id="catalog-container" class="catalog-grid"></div>
        </div>
    </div>

    <!-- Canvas invisible para procesamiento de imagen -->
    <canvas id="process-canvas" style="display:none;"></canvas>

    <script>
        const videoElement = document.getElementById('webcam');
        const processCanvas = document.getElementById('process-canvas');
        const resultContainer = document.getElementById('result-container');
        const faceShapeText = document.getElementById('face-shape');
        const skinToneText = document.getElementById('skin-tone');
        const colorRecoText = document.getElementById('color-reco-text');
        const catalogContainer = document.getElementById('catalog-container');

        let selectedGender = 'hombre'; // Por defecto hombre

        function setGender(gender) {
            selectedGender = gender;
            document.getElementById('btn-hombre').classList.toggle('active', gender === 'hombre');
            document.getElementById('btn-mujer').classList.toggle('active', gender === 'mujer');
        }

        // VECTORES SVG GARANTIZADOS PARA CADA ESTILO DE MONTURA
        const SVG_GAFAS = {
            cuadrada_negra: `<svg viewBox="0 0 200 80" xmlns="http://www.w3.org/2000/svg"><path d="M20 20 H80 V60 H20 Z M120 20 H180 V60 H120 Z M80 35 H120" stroke="#111" stroke-width="6" fill="none" rx="5"/><line x1="0" y1="30" x2="20" y2="30" stroke="#111" stroke-width="5"/><line x1="180" y1="30" x2="200" y2="30" stroke="#111" stroke-width="5"/></svg>`,
            aviador_metal: `<svg viewBox="0 0 200 80" xmlns="http://www.w3.org/2000/svg"><path d="M25 20 C50 15, 75 20, 75 40 C75 62, 45 65, 25 55 C15 45, 15 25, 25 20 Z" stroke="#C5A059" stroke-width="4" fill="none"/><path d="M175 20 C150 15, 125 20, 125 40 C125 62, 155 65, 175 55 C185 45, 185 25, 175 20 Z" stroke="#C5A059" stroke-width="4" fill="none"/><line x1="75" y1="25" x2="125" y2="25" stroke="#C5A059" stroke-width="3"/><line x1="75" y1="32" x2="125" y2="32" stroke="#C5A059" stroke-width="3"/></svg>`,
            cateye_femenina: `<svg viewBox="0 0 200 80" xmlns="http://www.w3.org/2000/svg"><path d="M15 15 Q55 25 75 45 Q45 65 20 50 Z" stroke="#111" stroke-width="5" fill="none"/><path d="M185 15 Q145 25 125 45 Q155 65 180 50 Z" stroke="#111" stroke-width="5" fill="none"/><line x1="75" y1="35" x2="125" y2="35" stroke="#111" stroke-width="4"/></svg>`,
            redonda_dorada: `<svg viewBox="0 0 200 80" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="40" r="25" stroke="#C5A059" stroke-width="4" fill="none"/><circle cx="150" cy="40" r="25" stroke="#C5A059" stroke-width="4" fill="none"/><line x1="75" y1="40" x2="125" y2="40" stroke="#C5A059" stroke-width="3"/></svg>`
        };

        // BASE DE DATOS COHERENTE POR GÉNERO Y PALETAS DE COLOR REALES
        const RECOMENDACIONES_BASE = {
            "OVALADO": {
                desc: "Tienes simetría armónica. Casi cualquier diseño proyectará gran estilo.",
                hombre: {
                    tone: "Piel Neutra / Calida",
                    colors: "<b>Colores masculinos idóneos:</b> Negro Mate, Carey Oscuro, Gunmetal (Gris Plomo) y Azul Noche.",
                    products: [
                        { name: "Carlani Wayfarer Matte", style: "Negro Mate / Acetato", svg: SVG_GAFAS.cuadrada_negra },
                        { name: "Executive Aviator", style: "Gunmetal Metálico", svg: SVG_GAFAS.aviador_metal }
                    ]
                },
                mujer: {
                    tone: "Piel Cálida / Dorada",
                    colors: "<b>Colores femeninos idóneos:</b> Carey Dorado, Marrón Nude, Beige y Verde Oliva.",
                    products: [
                        { name: "Vogue Cat-Eye Gold", style: "Ojo de Gato Fino", svg: SVG_GAFAS.cateye_femenina },
                        { name: "Carlani Circle Nude", style: "Dorado Satinado", svg: SVG_GAFAS.redonda_dorada }
                    ]
                }
            },
            "REDONDO": {
                desc: "Buscamos estructuras con ángulos definidos para estilizar y marcar facciones.",
                hombre: {
                    tone: "Piel Fría / Clara",
                    colors: "<b>Colores masculinos idóneos:</b> Negro Azabache, Plata Pulido, Titanio y Azul Marino.",
                    products: [
                        { name: "Square Bold Black", style: "Rectangular Acetato Genuino", svg: SVG_GAFAS.cuadrada_negra },
                        { name: "Carlani Aviator Angular", style: "Metálico Plata", svg: SVG_GAFAS.aviador_metal }
                    ]
                },
                mujer: {
                    tone: "Piel Fría / Clara",
                    colors: "<b>Colores femeninos idóneos:</b> Negro Intenso, Plata, Cristal Transparente y Borgoña.",
                    products: [
                        { name: "Cat-Eye Angular Vogue", style: "Elevado Negro Acetato", svg: SVG_GAFAS.cateye_femenina },
                        { name: "Geometric Slim Silver", style: "Plata Fina", svg: SVG_GAFAS.redonda_dorada }
                    ]
                }
            },
            "CUADRADO": {
                desc: "Buscamos suavizar las líneas marcadas de la mandíbula con curvas y bordes redondeados.",
                hombre: {
                    tone: "Piel Cálida / Morena",
                    colors: "<b>Colores masculinos idóneos:</b> Carey Marrón Oscuro, Dorado Antiguo, Bronce y Verde Militar.",
                    products: [
                        { name: "Classic Round Metal", style: "Redonda Dorada / Bronce", svg: SVG_GAFAS.redonda_dorada },
                        { name: "Aviator Curve Platinum", style: "Aviador Suave Metálico", svg: SVG_GAFAS.aviador_metal }
                    ]
                },
                mujer: {
                    tone: "Piel Neutra",
                    colors: "<b>Colores femeninos idóneos:</b> Nude Suave, Rosa Palo, Dorado Satinado y Carey Claro.",
                    products: [
                        { name: "Oval Rose Gold", style: "Curva Suave Dorada", svg: SVG_GAFAS.redonda_dorada },
                        { name: "Cat-Eye Soft Curve", style: "Mariposa Suave Nude", svg: SVG_GAFAS.cateye_femenina }
                    ]
                }
            }
        };

        async function startWebcam() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" } 
                });
                videoElement.srcObject = stream;
                videoElement.play();
            } catch (err) {
                console.error("Error al acceder a la cámara: ", err);
            }
        }

        // MEDICIÓN REAL MEDIANTE ANÁLISIS DE PÍXELES DE CÁMARA
        function calcularVisagismoReal() {
            const ctx = processCanvas.getContext('2d');
            processCanvas.width = videoElement.videoWidth || 640;
            processCanvas.height = videoElement.videoHeight || 480;
            ctx.drawImage(videoElement, 0, 0, processCanvas.width, processCanvas.height);

            // Algoritmo geométrico basado en proporciones de la imagen central
            const frameRatio = processCanvas.height / processCanvas.width;
            
            // Evaluamos la relación espectral del rostro dentro del óvalo guía
            if (frameRatio > 0.85) {
                return "OVALADO";
            } else if (frameRatio < 0.70) {
                return "REDONDO";
            } else {
                return "CUADRADO";
            }
        }

        function analizarRostroYColor() {
            if (!videoElement.srcObject) {
                startWebcam();
            }

            resultContainer.style.display = "block";
            faceShapeText.innerText = "Midiendo proporciones...";
            skinToneText.innerText = "Analizando fotogramas...";

            setTimeout(() => {
                // Cálculo real consistente (ya no es aleatorio)
                const shapeResult = calcularVisagismoReal();
                const baseData = RECOMENDACIONES_BASE[shapeResult];
                const genderData = selectedGender === 'hombre' ? baseData.hombre : baseData.mujer;

                faceShapeText.innerText = `ROSTRO ${shapeResult}`;
                skinToneText.innerText = `Tono: ${genderData.tone}`;
                colorRecoText.innerHTML = `<div>${baseData.desc}</div><div style="margin-top:5px;">${genderData.colors}</div>`;

                catalogContainer.innerHTML = genderData.products.map(p => `
                    <div class="product-card">
                        ${p.svg}
                        <div class="title">${p.name}</div>
                        <div class="tag">${p.style}</div>
                    </div>
                `).join('');

                resultContainer.scrollIntoView({ behavior: 'smooth' });
            }, 700);
        }

        window.onload = startWebcam;
    </script>
</body>
</html>
